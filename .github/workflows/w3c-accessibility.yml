name: W3C Compliance & Accessibility

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types: [completed]
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: W3C & Accessibility Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
        if: github.event.workflow_run.id != ''

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        if: github.event.workflow_run.id == ''

      - name: HTML5 Validation
        id: html5
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: dist/
        continue-on-error: true

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v1.9.0
        with:
          args: --verbose --no-progress "dist/**/*.html"
        continue-on-error: true

      - name: Start Local Server
        run: npx serve -s dist -p 3000 &

      - name: Run Accessibility Checks (Pa11y)
        id: pa11y
        run: |
          sleep 5
          npx pa11y-ci --sitemap http://localhost:3000/sitemap.xml --sitemap-find https://re-evented.org --sitemap-replace http://localhost:3000
        continue-on-error: true

      - name: Cleanup server
        if: always()
        run: pkill -f "serve -s dist" || true

      - name: Validation Summary
        if: always()
        run: |
          echo "### W3C & Accessibility Results" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| HTML5 Validation | ${{ steps.html5.outcome == 'success' && '✅ Passed' || '⚠️ Issues found (advisory)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Link Checker | ${{ steps.lychee.outcome == 'success' && '✅ Passed' || '⚠️ Issues found (advisory)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Accessibility (Pa11y) | ${{ steps.pa11y.outcome == 'success' && '✅ Passed' || '⚠️ Issues found (advisory)' }} |" >> $GITHUB_STEP_SUMMARY
