name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      - name: Test newsletter endpoint
        run: bash tests/subscribe.test.sh

      - name: Test asset hashing
        run: npm run test:hash

      - name: Test Tailwind build
        run: npm run test:tailwind

      - name: Build project
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          include-hidden-files: true
          retention-days: 7

  validate:
    name: W3C & Accessibility
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: HTML5 Validation
        uses: Cyb3r-Jak3/html5validator-action@41633d488eb36e18fd1a95ffc83daf1bf22a75bd # v7.2.0
        with:
          root: dist/

      - name: Link Checker (advisory)
        uses: lycheeverse/lychee-action@22134d37a1fff6c2974df9c92a7c7e1e86a08f9c # v1.9.0
        with:
          args: --verbose --no-progress "dist/**/*.html"
        continue-on-error: true

      - name: Accessibility (Pa11y)
        run: |
          npx serve dist -p 3000 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ >/dev/null && break; sleep 1; done
          npx pa11y-ci --sitemap http://localhost:3000/sitemap.xml --sitemap-find https://re-evented.org --sitemap-replace http://localhost:3000

  deploy:
    name: Deploy to SiteGround
    needs: [build-and-test, validate]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy to SiteGround
        env:
          SITEGROUND_HOST: ssh.re-evented.org
          SITEGROUND_USER: u1589-twuamlkm7vvc
          SITEGROUND_SSH_KEY: ${{ secrets.SITEGROUND_SSH_KEY }}
          SITEGROUND_REMOTE_PATH: www/re-evented.org/public_html
          SITEGROUND_PORT: 18765
        run: node deploy.js

      - name: Smoke test production
        run: |
          check() { curl -s -o /dev/null -w '%{http_code}' "https://re-evented.org$1?smoke=${GITHUB_SHA}-$2"; }
          for i in $(seq 1 12); do
            home=$(check / $i); subs=$(check /subscribers.txt $i); hta=$(check /.htaccess $i); tw=$(check /tailwind.css $i)
            echo "try $i: home=$home subscribers=$subs htaccess=$hta tailwind=$tw"
            [ "$home" = 200 ] && [ "$subs" != 200 ] && [ "$hta" = 403 ] && [ "$tw" = 200 ] && exit 0
            sleep 5
          done
          exit 1
